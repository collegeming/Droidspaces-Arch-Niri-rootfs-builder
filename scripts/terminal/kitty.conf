# Kitty 配置 —— Arch + niri + noctalia + Maple Mono + Catppuccin Frappe
# 融合 Flacier(光标拖尾/性能) 与 SHORiN(Catppuccin 主题/无边框) 两篇，并适配 niri

# ── 主题：Catppuccin Frappe（取代手写 16 色）──
include themes/frappe.conf

# ── Shell：fish + 交互登录（reef/tide 都在 fish 侧）──
shell /usr/bin/fish --login --interactive

# ── 字体：Maple Mono NF CN（等宽 + Nerd 图标 + 中文）──
font_family Maple Mono NF CN
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0

# ── 窗口 ──
window_padding_width 5
hide_window_decorations yes      # niri 下无边框更干净
remember_window_size no

# ── 透明度：必须半透明，niri 的 blur 才显形 ──
background_opacity 0.85
# 注意：不要写 background_blur —— niri Wayland 下不生效，改在 niri.kdl 配

# ── 光标 ──
cursor_shape block
cursor_color #ffffff
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

# ── Neovide 风格光标拖尾（需 kitty >= 0.26.0）──
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ── 其他 ──
url_color #0087bd
confirm_os_window_close 0
scrollback_lines 10000
