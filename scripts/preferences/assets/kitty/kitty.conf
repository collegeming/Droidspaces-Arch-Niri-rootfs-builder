# kitty 配置 — Arch + niri + Noctalia + Maple Mono NF CN + Catppuccin Frappé
# 注意：数值型选项的值后面不能写行内注释（kitty 会把 # 之后当成值的一部分导致解析失败）

include themes/frappe.conf

# fish 作为交互登录 shell（tide/reef 都在 fish 侧）
shell /usr/bin/fish --login --interactive

# 字体：等宽 + Nerd 图标 + 中文
font_family Maple Mono NF CN
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size @FONT_SIZE@

# 窗口：紧凑留白
window_padding_width 5
# 只在窗口创建时读取，改后需完全退出 kitty 重开
hide_window_decorations yes
remember_window_size no

# 透明度：半透明 + 模糊（需要较新版本的 kitty 与 niri 支持）
background_opacity 0.85
background_blur 32
wayland_titlebar_color background

# 内部标题条：有标题文字、无按钮
window_title_bar top
window_title_bar_min_windows 1
window_title_bar_align center
window_title_bar_active_foreground #c6d0f5
window_title_bar_active_background #51576d

# 光标（新版本中 cursor_color 已更名为 cursor，旧写法会被静默忽略）
cursor_shape block
cursor #ffffff
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

# Neovide 风格光标拖尾
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# 复制粘贴：划选即复制，右键粘贴（PuTTY 风格）
copy_on_select yes
mouse_map right press ungrabbed paste_selection

# 其他
url_color #0087bd
confirm_os_window_close 0
scrollback_lines 10000

# 字号：支持实时调整，不用重开窗口
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
mouse_map ctrl+scroll_up change_font_size all +1.0
mouse_map ctrl+scroll_down change_font_size all -1.0
