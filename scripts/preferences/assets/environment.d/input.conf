XMODIFIERS=@im=fcitx
INPUT_METHOD=fcitx
# 本文件只对 systemd 用户实例（D-Bus 激活的服务）生效；桌面会话是 system
# unit，读 /etc/environment 里同样的两个变量。
# fcitx5 被 D-Bus 提前激活时拿不到 WAYLAND_DISPLAY，会报
# "Failed to open wayland connection" 并抢走 org.fcitx.Fcitx5 总线名，导致
# niri 拉起的实例退出、输入法没有候选词。niri 首个 Wayland socket 固定为该名。
WAYLAND_DISPLAY=wayland-1
