config_version = 16

[location]
# 设备出口 IP 的城市是福州；Noctalia 的 IP 定位接口对这条运营商 NAT 只返回
# 国家质心（河南），所以固定为地址定位，避免天气跟着错误坐标走。
auto_locate = false
address = "福州"
latitude = 26.06139
longitude = 119.30611

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@anland-0" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@anland-0"]
    box_height = 196.0
    box_width = 810.0
    cx = 852.0
    cy = 954.0
    output = "anland-0"
    placement_height = 1136.0
    placement_width = 1704.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@anland-0".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[theme]
builtin = "Catppuccin"

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[widget.clock]
format = "{:%H:%M:%S}"

[widget.media]
hide_when_no_media = true
show_progress = true
title_scroll = "on_hover"

[widget.network]
show_vpn_label = true

[widget.volume]
show_label = false
