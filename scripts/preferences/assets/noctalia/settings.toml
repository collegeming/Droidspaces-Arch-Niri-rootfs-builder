config_version = 16

[location]
# 不写死城市：会话启动时 /usr/local/bin/noctalia-location-sync 按公网 IP 的
# 城市写入 address/latitude/longitude。在脚本完成前保持无地址，避免先显示
# Noctalia 内置 IP 定位返回的国家质心天气。
auto_locate = false
address = ""

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@anland-0" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@anland-0"]
    box_height = 196.0
    box_width = 810.0
    cx = 852.0
    cy = 954.0
    output = "anland-0"
    placement_height = 1136.0
    placement_width = 1704.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@anland-0".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[theme]
builtin = "Catppuccin"

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[widget.clock]
format = "{:%H:%M:%S}"

[widget.media]
hide_when_no_media = true
show_progress = true
title_scroll = "on_hover"

[widget.network]
show_vpn_label = true

[widget.volume]
show_label = false
