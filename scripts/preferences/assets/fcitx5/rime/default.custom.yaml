patch:
  __include: rime_ice_suggestion:/
  menu/page_size: 7
  # 左 Shift = commit_code：把已输入的编码字母直接上屏并切到英文
  # （用户要的“按 Shift 打英文”）；右 Shift = noop。
  # 注意：inline_ascii 只切行内英文、不立即上屏，语义与需求不符（曾误配）。
  # 与主容器 archniri 实际生效值一致（commit_code/noop），也是 rime_ice_suggestion
  # 的默认值；此处显式写出，避免预设变更后行为漂移。
  ascii_composer:
    good_old_caps_lock: true
    switch_key:
      Shift_L: commit_code
      Shift_R: noop
      Control_L: noop
      Control_R: noop
      Caps_Lock: clear
      Eisu_toggle: clear
