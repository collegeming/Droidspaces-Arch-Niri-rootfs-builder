name: 编译并发布 Droidspaces RootFS

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 选择要构建的发行版
        required: true
        type: choice
        default: Debian-13
        options:
          - Debian-13
          - Ubuntu-24
          - Ubuntu-25
          - Ubuntu-26
          - Fedora-43
          - Fedora-44
          - Arch
          - all
          - all-wayland
      custom_username:
        description: 自定义用户名
        required: false
        type: string
        default: Gold
      desktop:
        description: 主桌面（负责开机自启动的桌面）
        required: true
        type: choice
        default: KDE
        options:
          - none
          - KDE
          - KDE mobile
          - GNOME
          - Anland Next
          - Niri
          - Hyprland
          - Mango
          - Denial
      extra_desktops:
        description: "额外桌面，用逗号分隔（例如 Niri,Hyprland）"
        required: false
        type: string
        default: ""
      desktop_autostart:
        description: 桌面开机自启动（桌面为 none 时自动关闭）
        required: true
        type: boolean
        default: true
      display_backend:
        description: 显示后端（KDE mobile/GNOME/Anland Next/Niri/Hyprland/Mango/Denial 固定使用 Anland Wayland）
        required: true
        type: choice
        default: anland-wayland
        options:
          - x11
          - anland-wayland
      PulseAudio:
        description: PulseAudio 音频转发
        required: true
        type: choice
        default: socket
        options:
          - socket
          - tcp
          - none
      enable_zh_tz:
        description: 使用中文并设置上海时区
        required: true
        type: boolean
        default: true
      enable_mesa:
        description: 开启高通骁龙 GPU 支持
        required: true
        type: boolean
        default: true
      nosnap:
        description: 移除 Ubuntu Snap
        required: true
        type: boolean
        default: true
      enable_systemd257:
        description: 使用 systemd 257 包族（仅支持 none 和普通 KDE）
        required: true
        type: boolean
        default: false
      enable_srf:
        description: 开启 fcitx5 输入法
        required: true
        type: boolean
        default: true
      enable_binfmt:
        description: 开启跨架构支持
        required: true
        type: boolean
        default: false
      enable_yj:
        description: 开启 NAT 和硬件识别
        required: true
        type: boolean
        default: true
      enable_kfgj:
        description: 安装开发工具
        required: true
        type: boolean
        default: false
      enable_zip:
        description: 安装压缩工具
        required: true
        type: boolean
        default: true
      enable_docker:
        description: 安装 Docker
        required: true
        type: boolean
        default: false
      wayland_package_repository:
        description: Wayland 软件包仓库（公开的 owner/repository）
        required: true
        type: string
        default: Goldzxcbug/droidspaces-package
      apply_preferences:
        description: 应用桌面偏好设置（在 rootfs 构建末尾执行）
        required: false
        type: boolean
        default: false
      device_profile:
        description: 设备构建配置（留空为通用构建；xring-o3 仅支持 Arch + niri 且必须提供 Mali 栈）
        required: false
        type: string
        default: ""
      mali_stack_bundle_url:
        description: Mali 栈离线包地址（提供后强制开启 GPU 栈）
        required: false
        type: string
        default: ""
      mali_stack_bundle_sha256:
        description: Mali 栈离线包 SHA256 校验值（提供 URL 时必填）
        required: false
        type: string
        default: ""
      mali_stack_version:
        description: Mali 栈版本标识
        required: false
        type: string
        default: "2026.11.08"

permissions:
  contents: write

jobs:
  build:
    name: 构建
    uses: ./.github/workflows/build-rootfs-core.yml
    with:
      ui_language: zh
      build_target: ${{ inputs.build_target }}
      custom_username: ${{ inputs.custom_username }}
      desktop: ${{ inputs.desktop }}
      extra_desktops: ${{ inputs.extra_desktops }}
      desktop_autostart: ${{ inputs.desktop_autostart }}
      display_backend: ${{ inputs.display_backend }}
      PulseAudio: ${{ inputs.PulseAudio }}
      enable_zh_tz: ${{ inputs.enable_zh_tz }}
      enable_mesa: ${{ inputs.enable_mesa }}
      nosnap: ${{ inputs.nosnap }}
      enable_systemd257: ${{ inputs.enable_systemd257 }}
      enable_srf: ${{ inputs.enable_srf }}
      enable_binfmt: ${{ inputs.enable_binfmt }}
      enable_yj: ${{ inputs.enable_yj }}
      enable_kfgj: ${{ inputs.enable_kfgj }}
      enable_zip: ${{ inputs.enable_zip }}
      enable_docker: ${{ inputs.enable_docker }}
      wayland_package_repository: ${{ inputs.wayland_package_repository }}
      apply_preferences: ${{ inputs.apply_preferences }}
      device_profile: ${{ inputs.device_profile }}
      mali_stack_bundle_url: ${{ inputs.mali_stack_bundle_url }}
      mali_stack_bundle_sha256: ${{ inputs.mali_stack_bundle_sha256 }}
      mali_stack_version: ${{ inputs.mali_stack_version }}
