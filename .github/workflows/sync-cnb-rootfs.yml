name: 同步中文 RootFS 到 CNB

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 要同步的 GitHub Release 标签
        required: true
        default: droidspaces-rootfs-all-wayland
        type: string
      upload_concurrency:
        description: CNB 并发上传数
        required: true
        default: 8
        type: number

permissions:
  contents: read

jobs:
  sync-cnb:
    name: 同步已有 Release 到 CNB
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: 同步中文资产到 CNB
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
          CNB_ROOTFS_LANGUAGE: zh
          CNB_UPLOAD_CONCURRENCY: ${{ inputs.upload_concurrency }}
        run: bash scripts/publish-cnb-rootfs.sh "$RELEASE_TAG"
