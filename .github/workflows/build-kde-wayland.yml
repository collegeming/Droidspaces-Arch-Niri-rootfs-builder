name: 构建并发布 Anland KDE Wayland 软件包
run-name: Anland KDE 软件包 ${{ inputs.request_id || github.run_number }}

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 选择构建目标；all 会重建五个平台，单个平台会重建该包并复用其余资产
        required: true
        type: choice
        default: all
        options:
          - all
          - ubuntu2604
          - Debian13
          - Fedora43
          - Fedora44
          - Arch
      anland_ref:
        description: 要构建的 Anland 分支、标签或提交
        required: true
        type: string
        default: main
      anland_repo:
        description: Anland 仓库地址
        required: true
        type: string
        default: https://github.com/superturtlee/anland.git
      request_id:
        description: 可选的调用方请求 ID
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  # 一次只发布一组不可变的包资产。
  group: anland-kde-package-release
  cancel-in-progress: false

jobs:
  prepare:
    name: 解析 Anland 源码版本
    runs-on: ubuntu-latest
    outputs:
      anland_commit: ${{ steps.resolve.outputs.anland_commit }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: 生成构建矩阵
        id: targets
        env:
          BUILD_TARGET_INPUT: ${{ inputs.build_target }}
        shell: bash
        run: |
          set -euo pipefail

          case "$BUILD_TARGET_INPUT" in
            all)
              targets='["ubuntu2604","Debian13","Fedora43","Fedora44","Arch"]'
              ;;
            ubuntu2604|Debian13|Fedora43|Fedora44|Arch)
              targets="[\"$BUILD_TARGET_INPUT\"]"
              ;;
            *)
              echo "不支持的构建目标：$BUILD_TARGET_INPUT" >&2
              exit 1
              ;;
          esac

          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "构建目标：$targets"

      - name: 要求从 main 分支触发
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != main ]; then
            echo "此工作流必须从 main 分支触发。" >&2
            exit 1
          fi

      - name: 将请求的源解析为单个提交
        id: resolve
        env:
          ANLAND_REPO: ${{ inputs.anland_repo }}
          ANLAND_REF: ${{ inputs.anland_ref }}
        shell: bash
        run: |
          set -euo pipefail

          source_dir="$(mktemp -d)/anland"
          trap 'rm -rf "${source_dir%/anland}"' EXIT
          git init --quiet "$source_dir"
          git -C "$source_dir" remote add origin "$ANLAND_REPO"
          git -C "$source_dir" fetch --quiet --depth=1 origin "$ANLAND_REF"
          anland_commit="$(git -C "$source_dir" rev-parse FETCH_HEAD)"
          git -C "$source_dir" cat-file -e "${anland_commit}^{commit}"
          echo "anland_commit=$anland_commit" >> "$GITHUB_OUTPUT"
          echo "已将 $ANLAND_REPO @ $ANLAND_REF 解析为 $anland_commit"

  build:
    name: 构建 ${{ matrix.target }} 软件包
    needs: prepare
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}

    env:
      ANLAND_REPO: ${{ inputs.anland_repo }}
      ANLAND_COMMIT: ${{ needs.prepare.outputs.anland_commit }}
      BUILD_TARGET: ${{ matrix.target }}

    steps:
      - name: 解析构建目标
        id: target
        shell: bash
        run: |
          set -euo pipefail

          case "$BUILD_TARGET" in
            ubuntu2604)
              image=ubuntu:26.04
              script=producers/kde/ubuntu2604_v5/build.sh
              package_pattern='*.deb'
              asset_prefix=anland-kde-ubuntu2604-kwin-
              asset_arch=arm64
              archive_target=ubuntu2604
              ;;
            Debian13)
              image=debian:trixie
              script=producers/kde/Debian13_v5/build.sh
              package_pattern='*.deb'
              asset_prefix=anland-kde-debian13-kwin-
              asset_arch=arm64
              archive_target=debian13
              ;;
            Fedora43)
              image=fedora:43
              script=producers/kde/Fedora43_v5/build.sh
              package_pattern='*.rpm'
              asset_prefix=anland-kde-fedora43-kwin-
              asset_arch=aarch64
              archive_target=fedora43
              ;;
            Fedora44)
              image=fedora:44
              # Fedora 44 使用 Fedora 43 的构建脚本，配 Fedora 44 基础镜像。
              script=producers/kde/Fedora43_v5/build.sh
              package_pattern='*.rpm'
              asset_prefix=anland-kde-fedora44-kwin-
              asset_arch=aarch64
              archive_target=fedora44
              ;;
            Arch)
              image=ogarcia/archlinux:latest
              script=producers/kde/Arch_v5/build.sh
              package_pattern='*.pkg.tar.*'
              asset_prefix=anland-kde-arch-kwin-
              asset_arch=aarch64
              archive_target=arch
              ;;
            *)
              echo "不支持的构建目标：$BUILD_TARGET" >&2
              exit 1
              ;;
          esac

          {
            echo "image=$image"
            echo "script=$script"
            echo "package_pattern=$package_pattern"
            echo "asset_prefix=$asset_prefix"
            echo "asset_arch=$asset_arch"
            echo "archive_target=$archive_target"
          } >> "$GITHUB_OUTPUT"

      - name: 在对应的发行版中构建软件包
        env:
          DISTRO_IMAGE: ${{ steps.target.outputs.image }}
          BUILD_SCRIPT: ${{ steps.target.outputs.script }}
          PKG_PATTERN: ${{ steps.target.outputs.package_pattern }}
          OUTPUT_DIR: .kde-package-build/${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          docker run --rm \
            --platform linux/arm64 \
            -e ANLAND_REPO \
            -e ANLAND_COMMIT \
            -e BUILD_SCRIPT \
            -e BUILD_TARGET \
            -e PKG_PATTERN \
            -v "$PWD/$OUTPUT_DIR:/root/kde-packages" \
            -v "$PWD/$OUTPUT_DIR:/tmp/kde-packages" \
            "$DISTRO_IMAGE" \
            bash -lc '
              set -euo pipefail

              case "$BUILD_TARGET" in
                Debian13|ubuntu2604)
                  apt-get update
                  apt-get install -y --no-install-recommends \
                    git ca-certificates sudo \
                    build-essential devscripts dpkg-dev fakeroot patch
                  ;;
                Fedora43|Fedora44)
                  dnf install -y --setopt=install_weak_deps=False \
                    git ca-certificates sudo \
                    dnf-plugins-core rpmdevtools rpm-build patch tar xz
                  ;;
                Arch)
                  pacman -Syu --noconfirm
                  pacman -S --noconfirm --needed base-devel git ca-certificates sudo
                  useradd -m -s /bin/bash anland
                  printf "anland ALL=(root) NOPASSWD: /usr/bin/pacman\n" > /etc/sudoers.d/anland-pacman
                  chmod 0440 /etc/sudoers.d/anland-pacman
                  if grep -q "^#PACMAN_AUTH=()" /etc/makepkg.conf; then
                    sed -i "s/^#PACMAN_AUTH=().*/PACMAN_AUTH=(sudo)/" /etc/makepkg.conf
                  else
                    printf "\nPACMAN_AUTH=(sudo)\n" >> /etc/makepkg.conf
                  fi
                  chown -R anland:anland /tmp/kde-packages
                  ;;
              esac

              git init --quiet /tmp/anland
              git -C /tmp/anland remote add origin "$ANLAND_REPO"
              git -C /tmp/anland fetch --quiet --depth=1 origin "$ANLAND_COMMIT"
              git -C /tmp/anland checkout --quiet --detach FETCH_HEAD

              # Debian 13 使用 DEB822 源；上游构建脚本要求 deb-src。
              if [ "$BUILD_TARGET" = Debian13 ] && [ -f /etc/apt/sources.list.d/debian.sources ]; then
                sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/debian.sources
                apt-get update
              fi

              test -f "/tmp/anland/$BUILD_SCRIPT"
              chmod +x "/tmp/anland/$BUILD_SCRIPT"

              if [ "$BUILD_TARGET" = Arch ]; then
                su -s /bin/bash anland -c "cd /tmp/anland/$(dirname "$BUILD_SCRIPT") && WORKDIR=/tmp/kde-packages ./$(basename "$BUILD_SCRIPT") --noconfirm"
                chmod -R a+rwX /tmp/kde-packages
              else
                cd "/tmp/anland/$(dirname "$BUILD_SCRIPT")"
                WORKDIR=/root/kde-packages sudo -E "./$(basename "$BUILD_SCRIPT")"
              fi

              # 从主 kwin 包读取上游版本；不要把发行版打包修订号放进资产名。
              kwin_package=""
              kwin_version=""
              case "$BUILD_TARGET" in
                Debian13|ubuntu2604)
                  kwin_package="$(find /tmp/kde-packages -type f -name 'kwin-wayland_*.deb' -print | sort | head -n1)"
                  if [ -z "$kwin_package" ]; then
                    kwin_package="$(find /tmp/kde-packages -type f -name 'kwin-x11_*.deb' -print | sort | head -n1)"
                  fi
                  [ -n "$kwin_package" ] || { echo "未找到 kwin deb 包" >&2; exit 1; }
                  kwin_version="$(dpkg-deb -f "$kwin_package" Version)"
                  ;;
                Fedora43|Fedora44)
                  kwin_package="$(find /tmp/kde-packages -type f -name 'kwin-[0-9]*.rpm' -print | sort | head -n1)"
                  [ -n "$kwin_package" ] || { echo "未找到 kwin rpm 包" >&2; exit 1; }
                  kwin_version="$(rpm -qp --queryformat '%{VERSION}' "$kwin_package")"
                  ;;
                Arch)
                  kwin_package="$(find /tmp/kde-packages -type f -name 'kwin-[0-9]*.pkg.tar.*' -print | sort | head -n1)"
                  [ -n "$kwin_package" ] || { echo "未找到 kwin Arch 包" >&2; exit 1; }
                  kwin_version="$(pacman -Qp --print-format '%v' "$kwin_package")"
                  ;;
              esac
              # 去掉 epoch 和发行版/Arch 的 pkgrel，只保留 KWin 上游版本。
              kwin_version="${kwin_version#*:}"
              case "$BUILD_TARGET" in
                Debian13|ubuntu2604|Arch) kwin_version="${kwin_version%-*}" ;;
              esac
              [ -n "$kwin_version" ] || { echo "无法解析 KWin 版本" >&2; exit 1; }
              printf '%s\n' "$kwin_version" > /tmp/kde-packages/.kwin-version
            '

      - name: 打包 Release 资产
        id: package
        env:
          PKG_PATTERN: ${{ steps.target.outputs.package_pattern }}
          ASSET_PREFIX: ${{ steps.target.outputs.asset_prefix }}
          ASSET_ARCH: ${{ steps.target.outputs.asset_arch }}
          ARCHIVE_TARGET: ${{ steps.target.outputs.archive_target }}
          OUTPUT_DIR: .kde-package-build/${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail

          package_dir="$RUNNER_TEMP/anland-kde-packages/$ARCHIVE_TARGET"
          asset_dir="$GITHUB_WORKSPACE/.release-assets/$BUILD_TARGET"
          rm -rf "$package_dir" "$asset_dir"
          mkdir -p "$package_dir" "$asset_dir"

          copy_packages() {
            local source_dir="$1"
            [ -d "$source_dir" ] || return 0
            find "$source_dir" -type f -name "$PKG_PATTERN" \
              ! -name '*debug*' ! -name '*dbgsym*' ! -name '*.src.*' \
              ! -name 'kwin-dev_*' ! -name 'kwin-devel-*' ! -name 'kwin-doc-*' \
              ! -name 'xorg-x11-server-Xwayland-devel-*' -exec cp -v {} "$package_dir/" \;
          }

          if [ "$BUILD_TARGET" = Arch ]; then
            copy_packages "$OUTPUT_DIR"
          else
            copy_packages "$OUTPUT_DIR/kwin"
            copy_packages "$OUTPUT_DIR/xwayland"
            copy_packages "$OUTPUT_DIR/xorg-x11-server-Xwayland"
          fi

          package_count="$(find "$package_dir" -maxdepth 1 -type f -name "$PKG_PATTERN" | wc -l)"
          if [ "$package_count" -eq 0 ]; then
            echo "未为 $BUILD_TARGET 收集到任何可安装的软件包" >&2
            exit 1
          fi

          kwin_version="$(tr -d '[:space:]' < "$OUTPUT_DIR/.kwin-version")"
          case "$kwin_version" in
            ''|*[!A-Za-z0-9.+~_-]*)
              echo "KWin 版本包含不支持用于文件名的字符：$kwin_version" >&2
              exit 1
              ;;
          esac
          asset_name="${ASSET_PREFIX}${kwin_version}-${ASSET_ARCH}.tar.gz"
          asset_path="$asset_dir/$asset_name"
          tar -C "$RUNNER_TEMP" -czf "$asset_path" "anland-kde-packages/$ARCHIVE_TARGET"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"
          echo "已将 $package_count 个文件打包进 $asset_name"

      - name: 上传 Release 资产
        uses: actions/upload-artifact@v4
        with:
          name: anland-kde-package-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: 发布不可变的 Anland KDE 包 Release
    needs: [prepare, build]
    if: ${{ needs.prepare.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出安装脚本
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: 下载软件包资产
        uses: actions/download-artifact@v4
        with:
          pattern: anland-kde-package-*
          path: release-assets
          merge-multiple: true

      - name: 创建 Release 与校验和清单
        env:
          GH_TOKEN: ${{ github.token }}
          ANLAND_REPO: ${{ inputs.anland_repo }}
          ANLAND_REF: ${{ inputs.anland_ref }}
          ANLAND_COMMIT: ${{ needs.prepare.outputs.anland_commit }}
          REQUEST_ID: ${{ inputs.request_id }}
          BUILD_TARGET_INPUT: ${{ inputs.build_target }}
        shell: bash
        run: |
          set -euo pipefail

          release_dir="$GITHUB_WORKSPACE/release-assets"
          release_targets=(Arch Debian13 ubuntu2604 Fedora43 Fedora44)
          declare -A asset_by_target=()

          asset_prefix_for_target() {
            case "$1" in
              Arch) printf '%s\n' 'anland-kde-arch-kwin-' ;;
              Debian13) printf '%s\n' 'anland-kde-debian13-kwin-' ;;
              ubuntu2604) printf '%s\n' 'anland-kde-ubuntu2604-kwin-' ;;
              Fedora43) printf '%s\n' 'anland-kde-fedora43-kwin-' ;;
              Fedora44) printf '%s\n' 'anland-kde-fedora44-kwin-' ;;
              *) echo "不支持的构建目标：$1" >&2; return 1 ;;
            esac
          }

          target_label() {
            case "$1" in
              Arch) printf '%s\n' 'Arch Linux' ;;
              Debian13) printf '%s\n' 'Debian 13' ;;
              ubuntu2604) printf '%s\n' 'Ubuntu 26.04' ;;
              Fedora43) printf '%s\n' 'Fedora 43' ;;
              Fedora44) printf '%s\n' 'Fedora 44' ;;
              *) echo "不支持的构建目标：$1" >&2; return 1 ;;
            esac
          }

          local_asset_for_prefix() {
            local prefix="$1"
            local path
            local -a candidates=()
            while IFS= read -r path; do
              candidates+=("${path##*/}")
            done < <(find "$release_dir" -maxdepth 1 -type f -name "${prefix}*.tar.gz" -print | sort)
            if [ "${#candidates[@]}" -ne 1 ]; then
              echo "资产前缀 ${prefix} 在本次构建中应匹配一个文件，实际为 ${#candidates[@]} 个。" >&2
              return 1
            fi
            printf '%s\n' "${candidates[0]}"
          }

          release_asset_for_prefix() {
            local tag="$1"
            local prefix="$2"
            local name api_assets
            local -a candidates=()
            api_assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[].name')"
            while IFS= read -r name; do
              case "$name" in
                "${prefix}"*.tar.gz) candidates+=("$name") ;;
              esac
            done <<< "$api_assets"
            if [ "${#candidates[@]}" -ne 1 ]; then
              echo "Release ${tag} 中资产前缀 ${prefix} 应匹配一个文件，实际为 ${#candidates[@]} 个。" >&2
              return 1
            fi
            printf '%s\n' "${candidates[0]}"
          }

          case "$BUILD_TARGET_INPUT" in
            all)
              selected_prefix=""
              replacement_note='本次构建重新生成全部五个平台的软件包。'
              ;;
            ubuntu2604)
              selected_prefix="$(asset_prefix_for_target ubuntu2604)"
              ;;
            Debian13)
              selected_prefix="$(asset_prefix_for_target Debian13)"
              ;;
            Fedora43)
              selected_prefix="$(asset_prefix_for_target Fedora43)"
              ;;
            Fedora44)
              selected_prefix="$(asset_prefix_for_target Fedora44)"
              ;;
            Arch)
              selected_prefix="$(asset_prefix_for_target Arch)"
              ;;
            *)
              echo "不支持的构建目标：$BUILD_TARGET_INPUT" >&2
              exit 1
              ;;
          esac

          if [ -n "$selected_prefix" ]; then
            selected_asset="$(local_asset_for_prefix "$selected_prefix")"
            previous_tag=""
            for page in $(seq 1 10); do
              previous_tag="$(gh api \
                "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page" \
                --jq 'first(.[] | select((.draft == false) and (.tag_name | startswith("anland-kde-packages-"))) | .tag_name) // empty')"
              if [ -n "$previous_tag" ]; then
                break
              fi
            done
            if [ -z "$previous_tag" ]; then
              echo "没有找到完整的既有包 Release；首次发布必须选择 all。" >&2
              exit 1
            fi

            replacement_note="本次只重新生成 ${BUILD_TARGET_INPUT}（${selected_asset}）；其余四个平台沿用完整 Release ${previous_tag}。"
            previous_dir="$RUNNER_TEMP/anland-kde-previous-assets"
            rm -rf "$previous_dir"
            mkdir -p "$previous_dir"
            for target in "${release_targets[@]}"; do
              prefix="$(asset_prefix_for_target "$target")"
              [ "$prefix" = "$selected_prefix" ] && continue
              asset="$(release_asset_for_prefix "$previous_tag" "$prefix")"
              gh release download "$previous_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset" \
                --dir "$previous_dir"
              cp "$previous_dir/$asset" "$release_dir/$asset"
            done
          fi

          expected_assets=()
          for target in "${release_targets[@]}"; do
            prefix="$(asset_prefix_for_target "$target")"
            asset="$(local_asset_for_prefix "$prefix")"
            expected_assets+=("$asset")
            asset_by_target["$target"]="$asset"
          done

          cp scripts/install-anland-kde.sh "$release_dir/install-anland-kde.sh"
          chmod +x "$release_dir/install-anland-kde.sh"
          (
            cd "$release_dir"
            sha256sum "${expected_assets[@]}" install-anland-kde.sh > SHA256SUMS
          )

          build_time="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          release_tag="anland-kde-packages-$(date -u +'%Y%m%d-%H%M%S')-${GITHUB_RUN_ID}"
          release_asset_table="$(printf '%s\n' \
            '| 压缩包 | 目标系统 | 构建时间 |' \
            '| --- | --- | --- |')"
          for target in "${release_targets[@]}"; do
            release_asset_table="${release_asset_table}"$'\n'"| \`${asset_by_target[$target]}\` | $(target_label "$target") | ${build_time} |"
          done
          release_notes="$(printf '%s\n' \
            '# Anland KDE Wayland 预编译包' \
            '' \
            '这是供 Droidspaces Wayland RootFS 使用的不可变 ARM64/aarch64 包 Release。' \
            '' \
            '## 发布资产' \
            '' \
            "$release_asset_table" \
            '' \
            '压缩包文件名中的 `kwin-版本` 来自该发行版实际生成的 KWin 包；不同发行版的版本可以不同。' \
            '' \
            '每个压缩包只包含对应系统的 patched KWin/Xwayland 包；安装脚本会自动选择目标系统并校验 `SHA256SUMS`。' \
            '' \
            '## 构建详情' \
            '' \
            "- 构建目标：${BUILD_TARGET_INPUT}" \
            "- ${replacement_note}" \
            "- 构建时间：${build_time}" \
            "- 软件包请求 ID / Package request ID: ${REQUEST_ID:-manual-${GITHUB_RUN_ID}}" \
            "- 软件包工作流运行号：${GITHUB_RUN_ID}" \
            "- Anland 源码：\`${ANLAND_REPO}\` @ \`${ANLAND_COMMIT}\`（请求：\`${ANLAND_REF}\`）" \
            "- 工作流提交：\`${GITHUB_SHA}\`" \
            '- 架构：仅 ARM64/aarch64' \
            '')"
          gh release create "$release_tag" "$release_dir"/* \
            --draft \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title 'Anland KDE Wayland 预编译包' \
            --notes "$release_notes"
          gh release edit "$release_tag" --draft=false --latest=false

          echo "已发布 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$release_tag"
